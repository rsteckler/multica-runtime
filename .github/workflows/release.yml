name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      multica_version:
        description: "Multica CLI version (no leading v)"
        required: false
        default: "0.2.29"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/multica-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy:
      #   - tag push v1.2.3        → :v1.2.3 + :latest
      #   - main push              → :main + :sha-<short>
      #   - manual dispatch        → :dispatch-<sha>
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # MULTICA_VERSION defaults from the Dockerfile ARG, but a tag push
      # like v0.2.32 should rebuild against multica 0.2.32. Strip the
      # leading "v" for the build-arg.
      - id: multica
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="${{ github.event.inputs.multica_version || '0.2.29' }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MULTICA_VERSION=${{ steps.multica.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
