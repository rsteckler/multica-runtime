name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Manual override for testing a different multica CLI version without
  # editing the Dockerfile / cutting a new image tag.
  workflow_dispatch:
    inputs:
      multica_version:
        description: "Override MULTICA_VERSION build-arg (leave blank to use the Dockerfile default)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/multica-runtime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy:
      #   - tag push v1.2.3 → :v1.2.3 + :latest
      #   - main push       → :main + :sha-<short>
      #
      # The git tag is the *image* version (independent from the multica
      # CLI version baked inside it). To upgrade the baked multica CLI,
      # edit the Dockerfile's `ARG MULTICA_VERSION=...` and push a new
      # image tag. Decoupling them avoids the trap where the image tag
      # has to match a real multica release.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # build-args is only set when the manual-dispatch input is
          # non-empty. When empty, the Dockerfile ARG default wins.
          build-args: |
            ${{ github.event.inputs.multica_version && format('MULTICA_VERSION={0}', github.event.inputs.multica_version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
